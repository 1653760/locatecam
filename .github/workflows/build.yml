name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install python deps
        run: pip install ultralytics onnx onnxruntime onnxslim onnxsim pillow requests timm yacs easydict safetensors opencv-python-headless onnxscript

      - name: Export model
        run: python tools/export_model.py

      - name: Export tracker
        run: |
          git clone --depth 1 https://github.com/botaoye/OSTrack /tmp/OSTrack
          python tools/export_tracker.py /tmp/OSTrack

      - name: Export depth model
        run: python tools/export_depth.py

      - name: Download Vosk Chinese model
        run: |
          mkdir -p app/src/main/assets
          cd /tmp
          curl -sSL --retry 3 -o cn.zip https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          unzip -q cn.zip
          cd vosk-model-small-cn-0.22
          zip -q -r "$GITHUB_WORKSPACE/app/src/main/assets/model-cn.zip" .

      - name: Show assets
        run: ls -lh app/src/main/assets/

      - uses: actions/upload-artifact@v4
        with:
          name: model-assets
          path: app/src/main/assets/

  apk:
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model-assets
          path: app/src/main/assets/

      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Ensure SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Show outputs
        run: ls -lh app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: LocateCam-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: LocateCam v0.1.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
